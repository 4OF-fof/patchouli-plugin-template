name: release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json の版のリリースがあるかを調べる
        id: version
        run: |
          version=$(node -p "require('./plugin.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version はリリース済みのため、何もしません"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.done != 'true'
        with:
          node-version: 24
      - name: WASM のビルドの準備
        if: steps.version.outputs.done != 'true' && hashFiles('Cargo.toml') != ''
        run: rustup target add wasm32-wasip2
      - if: steps.version.outputs.done != 'true'
        run: npm ci
      - if: steps.version.outputs.done != 'true'
        run: npm run zip
      - name: タグとリリースを作り、zip を付ける
        if: steps.version.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" ./*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes $pre
